<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark rounded square background -->
  <rect width="64" height="64" rx="14" fill="#0a1628"/>

  <!-- Subtle inner glow / border -->
  <rect width="64" height="64" rx="14" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.18"/>

  <!-- Subtle grid dot pattern for depth -->
  <circle cx="10" cy="10" r="0.8" fill="#22d3ee" fill-opacity="0.08"/>
  <circle cx="22" cy="10" r="0.8" fill="#22d3ee" fill-opacity="0.08"/>
  <circle cx="34" cy="10" r="0.8" fill="#22d3ee" fill-opacity="0.08"/>
  <circle cx="46" cy="10" r="0.8" fill="#22d3ee" fill-opacity="0.08"/>
  <circle cx="58" cy="10" r="0.8" fill="#22d3ee" fill-opacity="0.08"/>
  <circle cx="10" cy="54" r="0.8" fill="#22d3ee" fill-opacity="0.08"/>
  <circle cx="58" cy="54" r="0.8" fill="#22d3ee" fill-opacity="0.08"/>

  <!-- Glow bloom behind the prompt -->
  <ellipse cx="26" cy="33" rx="14" ry="10" fill="#22d3ee" fill-opacity="0.07"/>

  <!-- ">" chevron prompt — cyan -->
  <path d="M14 24 L24 33 L14 42" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cursor block — slightly muted cyan -->
  <rect x="29" y="29" width="8" height="9" rx="1.5" fill="#22d3ee" fill-opacity="0.85"/>
</svg>
